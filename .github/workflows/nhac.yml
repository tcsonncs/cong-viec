name: Nhac viec

on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 hằng ngày, giờ Việt Nam
    - cron: '0 13 * * 0'   # 20:00 Chủ nhật, giờ Việt Nam (tổng kết tuần)
    - cron: '0 13 * * 1-6' # 20:00 thứ Hai đến thứ Bảy (lịch ngày mai)
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning (nhắc sáng), evening (lịch ngày mai) hoặc week (tổng kết tuần)'
        default: morning

jobs:
  nhac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node nhac/nhac.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 13 * * 0' && 'week' || github.event.schedule == '0 13 * * 1-6' && 'evening' || 'morning') }}
