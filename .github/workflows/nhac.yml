name: Nhac viec

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning hoac week'
        default: morning

jobs:
  nhac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node nhac/nhac.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 13 * * 0' && 'week' || 'morning') }}
